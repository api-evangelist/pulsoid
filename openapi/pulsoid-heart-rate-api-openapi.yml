openapi: 3.0.3
info:
  title: Pulsoid Features Heart Rate API
  description: Pulsoid enables real-time heart rate data transmission from peripherals (BLE heart rate monitors, smartwatches, etc.) to clients. The Pulsoid REST API provides endpoints to read and submit heart rate data, manage widgets, profile, and validate tokens. Real-time streaming is available via WebSocket endpoints.
  version: '1.0'
  contact:
    name: Pulsoid Support
    url: https://docs.pulsoid.net/
servers:
- url: https://dev.pulsoid.net
  description: Pulsoid API
security:
- BearerAuth: []
tags:
- name: Heart Rate
paths:
  /api/v1/data/heart_rate/latest:
    get:
      summary: Get latest heart rate
      description: Retrieves the latest heart rate measurement for the authenticated user.
      operationId: getLatestHeartRate
      tags:
      - Heart Rate
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Latest heart rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  measured_at:
                    type: integer
                    format: int64
                    description: Unix timestamp (ms)
                  data:
                    type: object
                    properties:
                      heart_rate:
                        type: integer
        '401':
          description: Unauthorized
  /api/v1/data:
    post:
      summary: Submit heart rate data
      description: Submits heart rate data points (write scope required).
      operationId: submitHeartRate
      tags:
      - Heart Rate
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                heart_rate:
                  type: integer
                measured_at:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Submitted
        '401':
          description: Unauthorized
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
    OAuth2:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://pulsoid.net/oauth2/authorize
          scopes:
            data:heart_rate:read: Read heart rate data
            data:heart_rate:write: Write heart rate data
            data:statistics:read: Read heart rate statistics
            data:room:read: Read room real-time data
            widgets:read: Read widgets
            widgets:update: Create or update widgets
            profile:read: Read profile
            geometry_dash_mod:configuration:read: Read GD mod config
            geometry_dash_mod:configuration:write: Update GD mod config
        authorizationCode:
          authorizationUrl: https://pulsoid.net/oauth2/authorize
          tokenUrl: https://pulsoid.net/oauth2/token
          scopes:
            data:heart_rate:read: Read heart rate data
            data:heart_rate:write: Write heart rate data
            data:statistics:read: Read heart rate statistics
            widgets:read: Read widgets
            widgets:update: Create or update widgets
            profile:read: Read profile
